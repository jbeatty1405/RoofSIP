name: Storm weather cron

# BACKUP + ALARM. The real scheduler is the Vercel cron in vercel.json (every 10
# min). GitHub ran this "hourly" job only every 4-7 hours in Sep-Oct 2026, which
# is why storms were missed, so it is not trusted to schedule anything. It still
# runs a check and fails loudly (GitHub emails) if any ZIP is blind.
# workflow_dispatch allows manual runs.
on:
  schedule:
    - cron: '5 * * * *' # :05, between Vercel's :00 and :10 runs so the 4-min run guard doesn't skip it
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit storm cron endpoint
        run: |
          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://roofsip.vercel.app/api/cron/weather)
          echo "HTTP $code"
          cat /tmp/out.txt
          echo
          test "$code" = "200"

          # A 200 is NOT proof the monitor is watching. If a ZIP can't be
          # geocoded we cannot see storms there, and the run would otherwise
          # look identical to "clear skies". Fail loudly so GitHub emails us.
          blind=$(python3 -c "import json;print(json.load(open('/tmp/out.txt')).get('zips_blind',0))")
          if [ "$blind" != "0" ]; then
            echo "::error::Storm monitor is BLIND on $blind ZIP(s) — storms there cannot be detected."
            exit 1
          fi
